[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:libreoffice]
command=libreoffice --accept="socket,host=localhost,port=2002;urp;" --headless --safe-mode --norestore --invisible
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/libreoffice.err.log
stdout_logfile=/var/log/supervisor/libreoffice.out.log
user=root
priority=100

[program:python-server]
command=python3 /app/server.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/python-server.err.log
stdout_logfile=/var/log/supervisor/python-server.out.log
user=root
priority=200
