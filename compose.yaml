services:
  libreoffice-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libreoffice-converter
    ports:
      - "8080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - net

networks:
  net:
    driver: bridge
