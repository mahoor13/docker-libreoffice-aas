services:
  converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libreoffice-converter
    restart: unless-stopped
    ports:
      - "8500:8080"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    networks:
      - net

networks:
  net:
    driver: bridge
