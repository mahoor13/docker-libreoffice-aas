worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  keepalive_timeout  65;
  client_max_body_size 100M;

  # Docker embedded DNS server
  resolver 127.0.0.11 ipv6=off valid=10s;

  # Per-request dynamic DNS resolution over all converter replicas
  map $http_host $backend { default converter:8080; }

  server {
    listen 80 default_server;

    location / {
      proxy_connect_timeout   3s;
      proxy_send_timeout     30s;
      proxy_read_timeout    300s;   # conversions may take a while
      proxy_http_version      1.1;
      proxy_set_header Connection "";

      # Retry on backend errors/timeouts/unavailable
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 4;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_pass http://$backend;
    }
  }
}


